schema: spec-driven

context: |
  Proyecto: NekoSSH — Cliente SSH moderno y editor remoto visual con estética Cyberpunk-Anime.
  Stack: Tauri v2 (Rust en backend, SQLite local, ssh2/russh), Frontend (TypeScript, Vite, HTML/CSS Vanilla con Tokens de Diseño), Emulación de Terminal (xterm.js + tauri), Editor Monaco integrado.
  Issue tracker: ZenTao — ver docs/zentao-integration.md
  ZenTao: solo planeación (alcance, criterios). Lo técnico en docs/ y OpenSpec.
  Prefijos git: task-<id>
  Idioma: español latino para documentación, artefactos OpenSpec, commits y tests humanos.
  Código puro (identificadores, rutas, SQL): inglés.

  Specs del proyecto (SSOT técnico): leer al planificar o implementar:
  - docs/project_scope.md — alcance, stack y fases
  - docs/base-standards.md — principios y reglas (SSOT núcleo)
  - docs/design/DESIGN.md — look & feel / tokens (SSOT visual)
  - docs/design/ui-layout-contract.md — shell, zonas, patrones de página
  - docs/design-system.md — índice (puntero; no editar verdad ahí)
  - docs/documentation-standards.md — mantenimiento de docs
  - docs/workflow-ciclo-end-to-end.md — ciclo ZenTao → opsx → archive
  - docs/openspec-tasks-mandatory-steps.md — pasos obligatorios por superficie

rules:
  _global:
    - Leer docs/base-standards.md antes de crear artefactos
    - Escribir proposal, design, specs y tasks en español latino
    - Commits y descripciones de tests en español latino; identificadores de código en inglés
    - Tareas pequeñas (máx. ~2 h cada una)
    - ZenTao aporta intención de negocio; no usar ZenTao como SSOT técnico
