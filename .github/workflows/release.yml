# Build NekoSSH for Windows, macOS, and Linux; upload installers to a draft GitHub Release.
# Docs: https://v2.tauri.app/distribute/pipelines/github/
#
# Layout: código Tauri en `app/` (no en la raíz del repo).
#
# How to run:
# 1. Bump version in app/package.json, app/src-tauri/Cargo.toml, and app/src-tauri/tauri.conf.json
# 2. Push to GitHub, then either:
#    - Actions → "Release" → Run workflow, or
#    - git tag v0.1.0 && git push origin v0.1.0
# 3. Review the draft release and publish it when ready.
#
# Repo setting (once): Settings → Actions → General → Workflow permissions → Read and write.

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './app/src-tauri -> target'

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: 'NekoSSH v__VERSION__'
          releaseBody: |
            Cliente SSH de escritorio (Cyber-Sakura).

            Descarga el instalador de tu plataforma en los assets de abajo.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
