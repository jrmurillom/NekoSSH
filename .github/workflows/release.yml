# Build NekoSSH for Windows; upload installer to a draft GitHub Release.
# Docs: https://v2.tauri.app/distribute/pipelines/github/
#
# Layout: código Tauri en `app/` (no en la raíz del repo).
#
# Por ahora solo Windows. macOS/Linux se pueden reactivar en el matrix cuando haga falta.
#
# How to run:
# 1. Bump version in app/package.json, app/src-tauri/Cargo.toml, and app/src-tauri/tauri.conf.json
# 2. Push to GitHub, then either:
#    - Actions → "Release" → Run workflow, or
#    - git tag v0.1.0 && git push origin v0.1.0
# 3. Review the draft release and publish it when ready.
#
# Repo setting (once): Settings → Actions → General → Workflow permissions → Read and write.

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './app/src-tauri -> target'

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: 'NekoSSH v__VERSION__'
          releaseBody: |
            Cliente SSH de escritorio (Cyber-Sakura).

            Instalador Windows en los assets de abajo.
          releaseDraft: true
          prerelease: false
